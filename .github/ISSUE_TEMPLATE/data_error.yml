name: 📉 데이터 오류 (주가 / 시가총액 / 재무 데이터)
description: 보고서의 주가, 시가총액, 밸류에이션 또는 재무 데이터가 틀렸다
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        제보에 감사한다 🙏 데이터 문제는 **확인 가능한 증거가 반드시 필요하다**: 구체적인 종목 + 틀린 수치 + 옳다고 보는 값 + **출처 링크**.
        구체적인 예 없이 "데이터가 자주 틀린다"고만 하면 확인할 수 없어 보완을 요청한다.
  - type: input
    id: ticker
    attributes:
      label: 관련 종목 / 종목 코드
      placeholder: "엔비디아 NVDA / 삼성전자 005930 / SK하이닉스 000660"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 문제가 나타난 Skill 또는 보고서
      description: 어느 skill이 만들었는지, 또는 reports/ 아래 어느 보고서인지(경로나 링크를 붙인다).
      placeholder: "reports/엔비디아/엔비디아-research-20260408.md, 또는 /investment-research"
    validations:
      required: true
  - type: textarea
    id: wrong-value
    attributes:
      label: 틀린 데이터는 무엇인가
      description: 어느 항목(주가/시가총액/PE/매출 등)이고, 보고서에 표시된 값은 얼마인가.
      placeholder: "보고서에 『시가총액 4.33조 달러』라고 적혀 있다"
    validations:
      required: true
  - type: textarea
    id: correct-value
    attributes:
      label: 옳다고 보는 값 + 출처 (필수)
      description: 옳은 값은 얼마인가? **출처 링크를 반드시 붙이고**(거래소·증권사 시세, 공식 실적 자료 등), 수정주가, 무상증자·액면분할, 유상증자, 환율 등 기준 문제가 얽혀 있는지 밝힌다.
      placeholder: |
        옳은 값은 약 4.65조 달러다.
        출처: https://finance.yahoo.com/quote/NVDA
        원인: 보고서가 쓴 총주식수가 증자 전의 옛 값이다 / 과거 주가를 수정주가로 조정하지 않았다
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 명령 / 절차
      placeholder: "/investment-research 엔비디아"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 기존 issue를 검색했고 중복이 없음을 확인했다
          required: true
        - label: 옳은 값과 확인 가능한 출처 링크를 제공했다
          required: true
