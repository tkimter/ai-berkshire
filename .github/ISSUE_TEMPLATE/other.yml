name: 💬 논의 / 새 Skill 제안 / 기타
description: 새 skill 제안, 사용법 논의, 감사 인사 또는 일반 의견(오류/데이터/개선 제안이 아닌 것)
title: "[논의] "
labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        여기는 **문제 신고가 아닌** 소통을 위한 곳이다: 새 skill 제안, 사용법 논의, 감사 인사 등.
        skill 오류, 데이터 오류를 알리거나 개선을 제안하려면 돌아가서 해당 전용 템플릿을 고른다(그쪽은 재현 가능한 정보가 필요하다).
  - type: textarea
    id: content
    attributes:
      label: 내용
      description: 무엇을 논의/제안하려는지 분명히 쓴다. 새 skill 제안이라면 어떤 연구 상황을 해결하는지, 기존 skill과의 경계가 무엇인지 설명한다.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 기존 issue를 검색했고 중복이 없음을 확인했다
          required: true
        - label: 이것은 skill 오류 / 데이터 오류 / 개선 제안이 아니다(그것들은 전용 템플릿으로 올린다)
          required: true
