name: 🐞 Skill 오류 / 실행 불가
description: 어떤 skill이 실행 중 오류를 내거나 멈추거나, 도구/인자가 없어 돌아가지 않는다
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        제보에 감사한다 🙏 **재현 가능한 구체적인 정보를 반드시 적는다.** 재현 정보가 없는 오류는 원인을 찾을 수 없어 보완을 요청하거나 바로 닫는다.
        올리기 전에 같은 issue가 이미 있는지 먼저 검색한다.
  - type: dropdown
    id: skill
    attributes:
      label: 관련 Skill
      description: 오류가 어느 skill에서 났는가? 하나만 고르고, 제목과 본문이 같은 skill을 가리키는지 확인한다(제목은 investment-research, 본문은 investment-team으로 적은 사례가 있었다).
      options:
        - article-writing
        - bottleneck-hunter
        - deep-company-series
        - dyp-ask
        - earnings-review
        - earnings-team
        - era-alpha
        - financial-data
        - income-investment
        - industry-funnel
        - industry-research
        - investment-checklist
        - investment-research
        - investment-team
        - management-deep-dive
        - news-pulse
        - portfolio-review
        - private-company-research
        - quality-screen
        - thesis-drift
        - thesis-tracker
        - investment-memo-craft (Codex 전용)
        - 잘 모르겠음
        - 기타 / 여러 개 관련
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: 실행한 전체 명령
      description: 실제로 입력한 명령을 한 글자도 빼지 않고 붙여 넣는다.
      placeholder: "/investment-team 엔비디아"
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 기대한 결과 vs 실제 결과
      description: 무엇이 일어나길 기대했고 실제로 무엇이 일어났는가? 설명만 하지 말고 **오류 메시지/로그 전체를 붙여 넣는다**.
      placeholder: |
        기대: 4대 거장 병렬 분석 보고서가 정상적으로 생성된다
        실제: "TeamCreate is not a valid tool" 오류가 나고 절차가 중단된다
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 처음부터 끝까지 어떻게 하면 재현되는가? (설치 방식, 실행 환경, 구체적인 조작 순서)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 사용한 모델
      description: 모델마다 동작이 다를 수 있다. 원인을 찾는 데 매우 중요한 항목이다.
      placeholder: "Opus 4.8 / Sonnet / 기타"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: 클라이언트와 버전
      placeholder: "Claude Code CLI (버전 번호) / Codex / IDE 플러그인"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 기존 issue를 검색했고 중복이 없음을 확인했다
          required: true
        - label: 재현 가능한 전체 정보(명령, 오류, 모델, 클라이언트)를 제공했다
          required: true
